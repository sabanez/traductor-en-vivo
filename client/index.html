<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traductor en vivo · Ponente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Traductor en vivo</span>
          <span class="brand-role">Ponente</span>
        </div>
        <div class="session">
          <span id="usage" class="usage"></span>
          <span id="audience" class="usage"></span>
          <span id="status" class="status"><span class="status-dot"></span><span id="status-text">Parado</span></span>
        </div>
      </header>

      <section class="share" aria-label="Compartir con los asistentes">
        <button id="qr" class="qr" type="button" title="Mostrar el código QR en grande"></button>
        <div class="share-text">
          <span class="field-label">Enlace para los asistentes</span>
          <a id="share-url" class="share-url" target="_blank" rel="noopener">Creando sala…</a>
        </div>
        <button id="copy" class="secondary" type="button">Copiar enlace</button>
      </section>

      <section class="controls" aria-label="Configuración">
        <label class="field">
          <span class="field-label">Idioma del ponente</span>
          <select id="source-language"></select>
        </label>
        <label class="field">
          <span class="field-label">Vista previa</span>
          <select id="preview-language"></select>
        </label>
        <label class="field field-grow">
          <span class="field-label">Glosario</span>
          <input id="glossary" type="text" placeholder="Nombres propios y términos, separados por comas" />
        </label>
        <button id="toggle" class="primary" type="button">Empezar</button>
      </section>

      <main id="panels" class="panels"></main>
    </div>

    <dialog id="qr-dialog" class="qr-dialog">
      <div id="qr-large" class="qr-large"></div>
      <p id="qr-caption" class="qr-caption"></p>
      <form method="dialog"><button class="secondary" type="submit">Cerrar</button></form>
    </dialog>

    <script type="module" src="/src/presenter.ts"></script>
  </body>
</html>
